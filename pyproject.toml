[project]
name = "subnational"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=2.0.0",
    "httpx2[http2]>=2.16.0",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "psutil>=7.2.2",
    "tenacity>=9.2.1",
    "topo-tools>=0.18.0",
]

[dependency-groups]
dev = ["obstore>=0.12.0", "python-dotenv>=1.2.4", "ruff>=0.17.2"]

[tool.ruff]
fix = true
lint.select = ["ALL"]
lint.ignore = ["COM812", "CPY001", "D203", "D213", "S603", "S607", "S608"]
