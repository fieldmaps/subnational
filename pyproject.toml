[project]
name = "subnational"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.117",
    "duckdb>=2.0.0",
    "httpx2>=2.16.0",
    "pandas>=3.1.1",
    "portolan-cli>=0.9.0",
    "psutil>=7.2.2",
    "python-dotenv>=1.2.4",
    "tenacity>=9.2.1",
    "topo-tools>=0.20.0",
    "tylertoo>=0.8.0",
]

[dependency-groups]
dev = ["ruff>=0.17.5"]

[tool.ruff]
fix = true
lint.select = ["ALL"]
lint.ignore = ["COM812", "CPY001", "D203", "D213", "S603", "S607", "S608"]

[tool.uv]
# geoparquet-io (via portolan-cli) pins duckdb<1.6; the pipeline needs DuckDB 2.0.
override-dependencies = ["duckdb>=2.0.0"]
